<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF7900">
  <title>Offline, OrangeSwim</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f7fa; color: #15202b; }
    .card { text-align: center; max-width: 26rem; padding: 2rem 1.5rem; background: #fff; border-radius: 16px;
      box-shadow: 0 4px 14px rgb(16 32 48 / 8%); }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { color: #e86c00; margin: 0.6rem 0 0.4rem; font-size: 1.5rem; }
    p { color: #5b6875; margin: 0 0 1.2rem; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 1.4rem;
      border-radius: 12px; background: #ff7900; color: #1a1a1a; font-weight: 700; text-decoration: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1520; color: #e8eef4; }
      .card { background: #16212e; }
      h1 { color: #ff7900; }
      p { color: #9aa8b6; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>OrangeSwim cannot reach the network right now. Check your connection and try again.</p>
    <a href="./">Try again</a>
  </main>
</body>
</html>
